[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movement-lens"
version = "0.4.0"
description = "Traceable player movement comparisons from Touchline datasets"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.118,<1", "uvicorn>=0.37,<1", "python-multipart>=0.0.18", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13"]
foundry = ["azure-ai-projects>=2,<3", "azure-identity>=1.19,<2"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["movement_lens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
